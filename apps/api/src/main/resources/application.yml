spring:
  application:
    name: mes-api
  datasource:
    url: jdbc:postgresql://localhost:5432/mes
    username: mes
    password: mes
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

mybatis-plus:
  type-handlers-package: com.xihua.mes.common.persistence
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: OTHER
  global-config:
    banner: false

# A2: default is jwt. JWT is not implemented yet, so X-Plant-Id is ignored and
# plant-scoped calls fail closed (400 PLANT_REQUIRED) until a token fills CurrentContext.
# Header mode (trust X-Plant-Id) is dev-only: see application-dev.yml. AuthModeGuard
# refuses to start when mode=header and the active profiles are not dev/test.
mes:
  auth:
    mode: jwt
