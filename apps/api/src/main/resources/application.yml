spring:
  application:
    name: mes-api
  datasource:
    url: jdbc:postgresql://localhost:5432/mes
    username: mes
    password: mes
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

mybatis-plus:
  type-handlers-package: com.xihua.mes.common.persistence
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: OTHER
  global-config:
    banner: false

# A2 / foundation §4.1: production mode is jwt. Header mode (trust X-Plant-Id) is dev-only;
# see application-dev.yml. AuthModeGuard refuses to start when mode=header outside dev/test.
# mes.auth.jwt.secret must be at least 32 bytes when mode=jwt (env MES_AUTH_JWT_SECRET).
mes:
  auth:
    mode: jwt
    jwt:
      secret: ${MES_AUTH_JWT_SECRET:}
