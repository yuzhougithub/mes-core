spring:
  application:
    name: mes-api
  datasource:
    url: jdbc:postgresql://localhost:5432/mes
    username: mes
    password: mes
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

mybatis-plus:
  type-handlers-package: com.xihua.mes.common.persistence
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: OTHER
  global-config:
    banner: false

# Skeleton auth: only "header" reads X-Plant-Id / X-User-Id.
# After JWT lands, set mes.auth.mode=jwt and never trust client plant headers.
mes:
  auth:
    mode: header
